<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#05060f}</style></head>
<body><canvas id="c" width="1200" height="630"></canvas>
<script src="../js/bricks.js"></script>
<script>
// The link-preview image (og.png, 1200x630): wall 1 of an example day, the name and the promise.
var c = document.getElementById('c'), x = c.getContext('2d');
var g = x.createLinearGradient(0, 0, 0, 630); g.addColorStop(0, '#05060f'); g.addColorStop(1, '#1a0b33');
x.fillStyle = g; x.fillRect(0, 0, 1200, 630);
x.strokeStyle = 'rgba(177,77,255,0.18)';
for (var i = 0; i <= 1200; i += 60) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 630); x.stroke(); }
for (i = 0; i <= 630; i += 60) { x.beginPath(); x.moveTo(0, i); x.lineTo(1200, i); x.stroke(); }
var w = NeonBricks.buildWall(3), s = 1.3, ox = 625, oy = 70;
w.bricks.forEach(function (b) {
  x.save(); x.shadowColor = b.color; x.shadowBlur = 16; x.fillStyle = b.color;
  x.fillRect(ox + b.x * s, oy + (b.y - 70) * s, b.w * s, b.h * s);
  if (b.hard) { x.shadowBlur = 0; x.strokeStyle = '#fff'; x.lineWidth = 3; x.strokeRect(ox + b.x * s + 4, oy + (b.y - 70) * s + 4, b.w * s - 8, b.h * s - 8); }
  x.restore();
});
x.save(); x.shadowColor = '#00f0ff'; x.shadowBlur = 24; x.fillStyle = '#fff';
x.beginPath(); x.arc(880, 470, 11, 0, 7); x.fill(); x.restore();
x.save(); x.shadowColor = '#ff00c8'; x.shadowBlur = 24; x.fillStyle = '#ff00c8'; x.fillRect(800, 545, 140, 20); x.restore();
function txt(t, y, size, color) { x.save(); x.font = 'bold ' + size + 'px Arial, sans-serif'; x.shadowColor = color; x.shadowBlur = 18; x.fillStyle = color; x.fillText(t, 60, y); x.restore(); }
txt('NEON', 200, 120, '#ff00c8'); txt('BRICKS', 320, 120, '#00f0ff');
txt('Un muro nuevo cada día,', 420, 40, '#ffffff'); txt('igual para todos.', 472, 40, '#ffffff');
txt('¿Superas mi puntaje?', 560, 34, '#ffdc3c');
</script></body></html>
